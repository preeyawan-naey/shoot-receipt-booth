<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SHOOT Receipt BOOTH</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;600;700&family=Playfair+Display:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="viewport">
      <div class="booth-screen" id="booth-screen">
        <!-- ==================== HOME PAGE ==================== -->
        <section class="page page--active" id="page-home" data-page="home">
          <header class="home-header">
            <img src="img/logo2.png" alt="SHOOT Receipt Booth" class="home-header__logo"> 
          </header>

          <div class="home-visual">
            <div class="dispenser">
              <img src="img/printer.png" alt="PRINTER" class="home-header_printer">
              <div class="receipt-preview">
                <img src="img/receipt.png" alt="RECEIPT" class="home-header_receipt">
              </div>
            </div>
          </div>

          <footer class="home-footer">
            <button
              class="start-overlay"
              id="btn-start-overlay"
              type="button"
              aria-label="Tap to START"
            ></button>
          
            <button class="start-btn" id="btn-start" type="button">
              Tap to <span class="start-btn__highlight">START</span>
            </button>
          </footer>
          
        </section>

        <!-- ==================== FRAME SELECTION PAGE ==================== -->
        <section class="page" id="page-frame-select" data-page="frame-select">
          <header class="frame-header">
            <button class="back-btn back-btn--icon" id="btn-back" type="button" aria-label="กลับ">
              <span class="back-btn__arrow" aria-hidden="true">&lsaquo;</span>
            </button>
            <div class="frame-title">
              <p class="frame-title__choose">Choose</p>
              <h2 class="frame-title__frame">FRAME</h2>
            </div>
          </header>

          <div class="frame-grid" id="frame-grid" role="listbox" aria-label="เลือกเฟรม">
            <!-- Frame cards rendered by JS -->
          </div>
        </section>

        <!-- ==================== CAMERA PAGE ==================== -->
        <section class="page" id="page-camera" data-page="camera">
          <header class="camera-header">
            <button class="back-btn" id="btn-camera-back" type="button">
              <span class="back-btn__arrow" aria-hidden="true">&lsaquo;</span>
              Back
            </button>
            <div class="camera-title">
              <p class="camera-title__look">Look the</p>
              <h2 class="camera-title__camera">CAMERA</h2>
            </div>
          </header>

          <div class="camera-body">
            <div class="camera-status">
              <span class="camera-status__label">PICTURE :</span>
              <span class="camera-status__counter" id="camera-photo-counter">00/01</span>
            </div>

            <div class="camera-viewport" id="camera-viewport">
              <video
                id="camera-video"
                class="camera-video"
                autoplay
                playsinline
                muted
              ></video>
              <canvas id="camera-canvas" class="camera-canvas" hidden></canvas>
              <div class="countdown-overlay" id="countdown-overlay" hidden>
                <span class="countdown-number" id="countdown-number"></span>
              </div>
              <div class="flash-overlay" id="flash-overlay" aria-hidden="true"></div>
            </div>
          </div>

          <footer class="camera-footer">
            <button
              class="shutter-btn"
              id="btn-shutter"
              type="button"
              aria-label="เริ่มถ่ายรูป"
            ></button>
          </footer>
        </section>

        <!-- ==================== PREVIEW PAGE ==================== -->
        <section class="page" id="page-process" data-page="process">
          <div class="preview-page">
            <div class="preview-dispenser">
              <img
                src="img/printer.png"
                alt="Printer"
                class="preview-dispenser__printer"
              />
              <div class="preview-dispenser__output">
                <div
                  class="frame-composite preview-dispenser__receipt"
                  id="receipt-composite"
                >
                  <canvas class="frame-composite__canvas" id="receipt-canvas"></canvas>
                </div>
              </div>
            </div>

            <div class="preview-actions">
              <button class="preview-btn" type="button" id="btn-retake">ถ่ายใหม่</button>
              <button class="preview-btn" type="button" id="btn-print">ปริ้น</button>
            </div>
          </div>
        </section>
      </div>
    </div>

    <!-- ใช้เฉพาะตอน print (มี QR 170×170 ต่อท้าย) -->
    <div class="print-receipt-wrapper" id="print-receipt-wrapper" aria-hidden="true">
      <canvas id="print-receipt-canvas"></canvas>
    </div>

    <div id="qr-popup" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 999; justify-content: center; align-items: center;">
      <div class="modal-content" style="background: white; padding: 30px; border-radius: 16px; text-align: center; max-width: 400px; width: 85%; box-shadow: 0 4px 20px rgba(0,0,0,0.3);">
          
          <h3 id="upload-status" style="margin-bottom: 15px; color: #333; font-family: sans-serif;">กำลังเตรียม QR Code...</h3>
          
          <div style="margin: 20px auto; min-height: 200px; display: flex; justify-content: center; align-items: center;">
              <img id="qr-code-display" src="" alt="QR Code" style="width: 200px; height: 200px; display: none;" />
          </div>
          
          <p style="color: #666; font-size: 11pt; margin-bottom: 20px;">สแกนเพื่อดาวน์โหลดรูปภาพของคุณเข้าสมาร์ตโฟน</p>
          
          <button type="button" onclick="closeQRPopup()" style="background: #ff4b72; color: white; border: none; padding: 10px 25px; border-radius: 8px; font-size: 11pt; cursor: pointer; font-weight: bold;">
              เสร็จสิ้น (กลับหน้าหลัก)
          </button>
      </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="js/frames.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/composite.js"></script>
    <script src="js/camera.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
