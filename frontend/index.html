<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SHOOT Receipt BOOTH</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css?v=booth47" />
  </head>
  <body>
    <div class="viewport">
      <div class="booth-screen" id="booth-screen">
        <!-- ==================== HOME PAGE ==================== -->
        <section class="page page--active" id="page-home" data-page="home">
          <header class="home-header">
            <img src="img/logo2.png" alt="SHOOT Receipt Booth" class="home-header__logo">
          </header>

          <div class="home-visual">
            <img
              src="img/Frame-index.png"
              alt=""
              class="home-index-art"
            />
          </div>

          <footer class="home-footer">
            <button
              class="start-overlay"
              id="btn-start-overlay"
              type="button"
              aria-label="Tap to START"
            ></button>

            <button class="start-btn start-btn--blink" id="btn-start" type="button">
              <span class="start-btn__highlight">TAP</span> to START
            </button>
          </footer>
        </section>

        <!-- ==================== CODE ENTRY PAGE ==================== -->
        <section class="page" id="page-code-entry" data-page="code-entry">
          <div class="code-entry">
            <h1 class="code-entry__title">
              Enter your <span class="code-entry__title-accent">Code</span>
            </h1>

            <div class="code-entry__digits" id="code-entry-digits" role="group" aria-label="รหัส 6 หลัก">
              <input class="code-digit" type="text" inputmode="numeric" maxlength="1" pattern="[0-9]*" autocomplete="one-time-code" aria-label="Digit 1" data-index="0" />
              <input class="code-digit" type="text" inputmode="numeric" maxlength="1" pattern="[0-9]*" aria-label="Digit 2" data-index="1" />
              <input class="code-digit" type="text" inputmode="numeric" maxlength="1" pattern="[0-9]*" aria-label="Digit 3" data-index="2" />
              <input class="code-digit" type="text" inputmode="numeric" maxlength="1" pattern="[0-9]*" aria-label="Digit 4" data-index="3" />
              <input class="code-digit" type="text" inputmode="numeric" maxlength="1" pattern="[0-9]*" aria-label="Digit 5" data-index="4" />
              <input class="code-digit" type="text" inputmode="numeric" maxlength="1" pattern="[0-9]*" aria-label="Digit 6" data-index="5" />
            </div>

            <p class="code-entry__error" id="code-entry-error" hidden></p>

            <button class="code-entry__submit" id="btn-code-submit" type="button" disabled>
              Submit
            </button>
          </div>
        </section>

        <!-- ==================== PAYMENT PAGE ==================== -->
        <section class="page" id="page-payment" data-page="payment">
          <header class="frame-header">
            <button class="back-btn back-btn--icon" id="btn-payment-back" type="button" aria-label="กลับ">
              <i data-lucide="chevron-left"></i>
            </button>
            <div class="frame-title">
              <h1 class="frame-title__heading frame-title__heading--payment">PAYMENT</h1>
            </div>
          </header>

          <div class="payment-body">
            <p class="payment-body__amount" id="payment-amount-text">สแกนเงินจำนวน 59 บาท</p>

            <div class="payment-body__qr-wrap" id="payment-qr-wrap">
              <div class="payment-body__qr-slot">
                <img
                  id="payment-qr-image"
                  class="payment-body__qr"
                  src=""
                  alt="PromptPay QR Code"
                  hidden
                />
                <div class="payment-body__qr-loading" id="payment-qr-loading" aria-live="polite">
                  <div class="payment-body__qr-spinner" aria-hidden="true"></div>
                  <p class="payment-body__qr-loading-text" id="payment-qr-loading-text">
                    กำลังโหลด QR PromptPay...
                  </p>
                </div>
              </div>
            </div>

            <p class="payment-body__status" id="payment-status" data-state="idle" hidden>
              รอการชำระเงิน...
            </p>

            <p class="payment-body__countdown">
              กลับหน้าหลักภายใน <span id="payment-countdown">300</span> วินาที
            </p>
          </div>
        </section>

        <!-- ==================== LAYOUT SELECTION PAGE ==================== -->
        <section class="page" id="page-layout-select" data-page="layout-select">
          <header class="frame-header">
            <button class="back-btn back-btn--icon" id="btn-layout-back" type="button" aria-label="กลับ">
              <i data-lucide="chevron-left"></i>
            </button>
            <div class="frame-title">
              <h1 class="frame-title__heading">LAYOUT</h1>
            </div>
          </header>

          <div class="layout-grid" id="layout-grid" role="listbox" aria-label="เลือก layout">
            <!-- Layout cards rendered by JS -->
          </div>
        </section>

        <!-- ==================== FRAME SELECTION PAGE ==================== -->
        <section class="page" id="page-frame-select" data-page="frame-select">
          <header class="frame-header">
            <button class="back-btn back-btn--icon" id="btn-frame-back" type="button" aria-label="กลับ">
              <i data-lucide="chevron-left"></i>
            </button>
            <div class="frame-title">
              <h1 class="frame-title__heading frame-title__heading--frame">FRAME</h1>
            </div>
          </header>

          <div
            class="frame-picker-row"
            id="frame-grid"
            role="listbox"
            aria-label="เลือก frame"
          >
            <!-- Frame cards rendered by JS -->
          </div>
        </section>

        <!-- ==================== CAMERA PAGE ==================== -->
        <section class="page" id="page-camera" data-page="camera">
          <header class="frame-header">
            <button class="back-btn back-btn--icon" id="btn-camera-back" type="button" aria-label="กลับ">
              <i data-lucide="chevron-left"></i>
            </button>
            <div class="frame-title">
              <h1 class="frame-title__heading">CAMERA</h1>
            </div>
          </header>

          <div class="camera-body">
            <div class="camera-status">
              <span class="camera-status__label">จำนวนรูปภาพ</span>
              <span class="camera-status__counter" id="camera-photo-counter">00/01</span>
            </div>

            <div class="camera-viewport" id="camera-viewport">
              <video
                id="camera-video"
                class="camera-video"
                autoplay
                playsinline
                muted
              ></video>
              <canvas id="camera-canvas" class="camera-canvas" hidden></canvas>
              <div class="countdown-overlay" id="countdown-overlay" hidden>
                <span class="countdown-number" id="countdown-number"></span>
              </div>
              <div class="flash-overlay" id="flash-overlay" aria-hidden="true"></div>
            </div>
          </div>

          <footer class="camera-footer">
            <button
              class="shutter-btn"
              id="btn-shutter"
              type="button"
              aria-label="เริ่มถ่ายรูป"
            ></button>
          </footer>
        </section>

        <!-- ==================== PREVIEW PAGE ==================== -->
        <section class="page" id="page-process" data-page="process">
          <div class="preview-page">
            <div class="preview-dispenser">
              <img
                src="img/printer.png"
                alt="Printer"
                class="preview-dispenser__printer"
              />
              <div class="receipt-preview preview-receipt-preview">
                <div class="preview-receipt-shadow">
                  <div class="preview-receipt-clip">
                    <div
                      class="frame-composite preview-dispenser__receipt"
                      id="receipt-composite"
                    >
                      <canvas class="frame-composite__canvas" id="receipt-canvas"></canvas>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="preview-prints">
              <p class="preview-prints__label">จำนวนรูปภาพ</p>
              <div class="preview-prints__counter">
                <button
                  type="button"
                  class="preview-prints__btn preview-prints__btn--minus"
                  id="btn-print-minus"
                  aria-label="ลดจำนวนสำเนา"
                >
                  <span aria-hidden="true">&minus;</span>
                </button>
                <span class="preview-prints__value" id="print-copies-value">1</span>
                <button
                  type="button"
                  class="preview-prints__btn preview-prints__btn--plus"
                  id="btn-print-plus"
                  aria-label="เพิ่มจำนวนสำเนา"
                >
                  <span aria-hidden="true">+</span>
                </button>
              </div>
            </div>

            <div class="preview-actions">
              <button class="preview-btn preview-btn--retake" type="button" id="btn-retake">ถ่ายใหม่</button>
              <button class="preview-btn preview-btn--print" type="button" id="btn-print">ปริ้น</button>
            </div>
          </div>
        </section>

        <!-- ==================== QR DOWNLOAD PAGE ==================== -->
        <section class="page" id="page-qr-download" data-page="qr-download">
          <div class="qr-download">
            <h1 class="qr-download__title">
              Scan to <span class="qr-download__title-accent">Download</span>
            </h1>
            <p class="qr-download__subtitle" id="qr-download-status">
              Scan to download your photo
            </p>

            <div class="qr-download__image-wrap">
              <img
                id="qr-download-image"
                class="qr-download__image"
                src=""
                alt="QR Code"
                hidden
              />
            </div>

            <p class="qr-download__countdown">
              กลับหน้าหลักใน <span id="qr-countdown">40</span> วินาที
            </p>

            <button type="button" class="qr-download__btn" id="btn-qr-home">
              Back to Home
            </button>
          </div>
        </section>

        <div class="print-overlay" id="print-overlay" hidden aria-hidden="true">
          <div class="print-overlay__content">
            <div class="print-overlay__spinner" aria-hidden="true"></div>
            <p class="print-overlay__text" id="print-overlay-text">กำลังพิมพ์...</p>
          </div>
        </div>
      </div>
    </div>

    <!-- ใช้เฉพาะตอน print (มี QR 170×170 ต่อท้าย) -->
    <div class="print-receipt-wrapper" id="print-receipt-wrapper" aria-hidden="true">
      <div id="print-copies-container"></div>
      <canvas id="print-receipt-canvas" hidden></canvas>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      lucide.createIcons();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/booth-settings.js?v=booth47"></script>
    <script src="js/tickets.js"></script>
    <script src="js/booth-storage.js?v=booth47"></script>
    <script src="js/layouts.js?v=booth47"></script>
    <script src="js/frames.js?v=booth47"></script>
    <script src="js/navigation.js?v=booth47"></script>
    <script src="js/payment.js?v=booth47"></script>
    <script src="js/code-entry.js"></script>
    <script src="js/escpos.js"></script>
    <script src="js/thermer.js"></script>
    <script src="js/native-print.js?v=booth47"></script>
    <script src="js/composite.js?v=booth47"></script>
    <script src="js/camera.js?v=booth47"></script>
    <script src="js/app.js?v=booth47"></script>
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>
  </body>
</html>
